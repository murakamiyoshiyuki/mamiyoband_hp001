name: Validate staff updates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Validate site content and links
        run: python scripts/validate_site.py
      - name: Build the site with Jekyll 4.2.2
        run: |
          mkdir -p "$RUNNER_TEMP/mamiyo-site"
          chmod 0777 "$RUNNER_TEMP/mamiyo-site"
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/srv/jekyll:ro" \
            --volume "$RUNNER_TEMP/mamiyo-site:/site" \
            jekyll/jekyll:4.2.2 \
            jekyll build --source /srv/jekyll --destination /site --disable-disk-cache
