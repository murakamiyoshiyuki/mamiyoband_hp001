<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>あいうえお - マミヨバンド</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .live-detail {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 30px;
            color: var(--color-gold);
        }
        .live-header {
            text-align: center;
            margin-bottom: 40px;
        }
        .live-header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-family: var(--font-heading-jp);
        }
        .live-venue {
            font-size: 1.2rem;
            color: var(--color-gold);
        }
        .live-details {
            max-width: 800px;
            margin: 40px auto;
            padding: 30px;
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
        .live-details p {
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 20px;
        }
        .live-images {
            margin: 40px 0;
            text-align: center;
        }
        .live-images img {
            max-width: 100%;
            margin-bottom: 30px;
        }
        .ticket-link {
            text-align: center;
            margin: 40px 0;
        }
        .ticket-btn {
            display: inline-block;
            padding: 15px 40px;
            background-color: var(--color-red);
            color: white;
            font-size: 1.2rem;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }
        .ticket-btn:hover {
            background-color: #A00C28;
        }
    </style>
</head>
<body>
    <div class="live-detail">
        <a href="index.html#live-info" class="back-link">← LIVE INFO一覧に戻る</a>
        
        <div class="live-header">
            <p class="live-date">2025.09.19</p>
            <h1>あいうえお</h1>
            <p class="live-venue">かきくけこ</p>
        </div>

        <div class="live-details">
            <p>さしすせそ</p>
        </div>

    </div>
</body>
</html>
