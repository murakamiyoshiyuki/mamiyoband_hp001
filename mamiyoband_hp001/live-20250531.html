<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>樋口舞と天井桟敷アンサンブル×マミヨバンド 2MAN LIVE SHOW - マミヨバンド</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .live-detail {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 30px;
            color: var(--color-gold);
        }
        .live-header {
            text-align: center;
            margin-bottom: 40px;
        }
        .live-header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-family: var(--font-heading-jp);
        }
        .live-venue {
            font-size: 1.2rem;
            color: var(--color-gold);
        }
        .live-images {
            margin: 40px 0;
            text-align: center;
        }
        .live-images img {
            max-width: 100%;
            margin-bottom: 30px;
        }
        .photo-gallery {
            margin-top: 50px;
        }
        .photo-gallery h2 {
            text-align: center;
            margin-bottom: 30px;
            font-family: var(--font-heading-jp);
        }
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }
        .photo-thumb {
            cursor: pointer;
            overflow: hidden;
            aspect-ratio: 1;
            border-radius: 5px;
        }
        .photo-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        .photo-thumb:hover img {
            transform: scale(1.1);
        }
        
        /* Lightbox styles */
        .photo-lightbox {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.95);
        }
        .photo-lightbox.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .lightbox-content {
            max-width: 90%;
            max-height: 90%;
        }
        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 40px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }
        .lightbox-close:hover {
            color: var(--color-gold);
        }
        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: #f1f1f1;
            font-size: 40px;
            cursor: pointer;
            padding: 10px;
            user-select: none;
        }
        .lightbox-nav:hover {
            color: var(--color-gold);
        }
        .lightbox-prev {
            left: 20px;
        }
        .lightbox-next {
            right: 20px;
        }
    </style>
</head>
<body>
    <div class="live-detail">
        <a href="index.html#live-info" class="back-link">← LIVE INFO一覧に戻る</a>
        
        <div class="live-header">
            <p class="live-date">2025.05.31</p>
            <h1>樋口舞と天井桟敷アンサンブル×マミヨバンド 2MAN LIVE SHOW</h1>
            <p class="live-venue">青山 月見ル君思フ</p>
        </div>

        <div class="live-images">
            <img src="素材/LIVE/2025.05.31/フライヤー.png" alt="フライヤー">
        </div>

        <div class="photo-gallery">
            <h2>LIVE PHOTOS</h2>
            <div class="photo-grid">
                <div class="photo-thumb" onclick="openLightbox(0)">
                    <img src="素材/LIVE/2025.05.31/LIVE写真/P25403210_0.jpg" alt="LIVE写真1">
                </div>
                <div class="photo-thumb" onclick="openLightbox(1)">
                    <img src="素材/LIVE/2025.05.31/LIVE写真/P25403211_0.jpg" alt="LIVE写真2">
                </div>
                <div class="photo-thumb" onclick="openLightbox(2)">
                    <img src="素材/LIVE/2025.05.31/LIVE写真/P25403213_0.jpg" alt="LIVE写真3">
                </div>
                <div class="photo-thumb" onclick="openLightbox(3)">
                    <img src="素材/LIVE/2025.05.31/LIVE写真/P25403216_0.jpg" alt="LIVE写真4">
                </div>
                <div class="photo-thumb" onclick="openLightbox(4)">
                    <img src="素材/LIVE/2025.05.31/LIVE写真/P25403221_0.jpg" alt="LIVE写真5">
                </div>
                <div class="photo-thumb" onclick="openLightbox(5)">
                    <img src="素材/LIVE/2025.05.31/LIVE写真/P2540323_0.jpg" alt="LIVE写真6">
                </div>
                <div class="photo-thumb" onclick="openLightbox(6)">
                    <img src="素材/LIVE/2025.05.31/LIVE写真/P2540324_0.jpg" alt="LIVE写真7">
                </div>
                <div class="photo-thumb" onclick="openLightbox(7)">
                    <img src="素材/LIVE/2025.05.31/LIVE写真/P2540325_0.jpg" alt="LIVE写真8">
                </div>
                <div class="photo-thumb" onclick="openLightbox(8)">
                    <img src="素材/LIVE/2025.05.31/LIVE写真/P2540326_0.jpg" alt="LIVE写真9">
                </div>
                <div class="photo-thumb" onclick="openLightbox(9)">
                    <img src="素材/LIVE/2025.05.31/LIVE写真/P2540327_0.jpg" alt="LIVE写真10">
                </div>
            </div>
        </div>
    </div>

    <!-- Lightbox -->
    <div id="photoLightbox" class="photo-lightbox">
        <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
        <span class="lightbox-nav lightbox-prev" onclick="changePhoto(-1)">&#10094;</span>
        <span class="lightbox-nav lightbox-next" onclick="changePhoto(1)">&#10095;</span>
        <img class="lightbox-content" id="lightboxImg">
    </div>

    <script>
        const photos = [
            '素材/LIVE/2025.05.31/LIVE写真/P25403210_0.jpg',
            '素材/LIVE/2025.05.31/LIVE写真/P25403211_0.jpg',
            '素材/LIVE/2025.05.31/LIVE写真/P25403213_0.jpg',
            '素材/LIVE/2025.05.31/LIVE写真/P25403216_0.jpg',
            '素材/LIVE/2025.05.31/LIVE写真/P25403221_0.jpg',
            '素材/LIVE/2025.05.31/LIVE写真/P2540323_0.jpg',
            '素材/LIVE/2025.05.31/LIVE写真/P2540324_0.jpg',
            '素材/LIVE/2025.05.31/LIVE写真/P2540325_0.jpg',
            '素材/LIVE/2025.05.31/LIVE写真/P2540326_0.jpg',
            '素材/LIVE/2025.05.31/LIVE写真/P2540327_0.jpg'
        ];
        let currentPhotoIndex = 0;

        function openLightbox(index) {
            currentPhotoIndex = index;
            document.getElementById('photoLightbox').classList.add('active');
            document.getElementById('lightboxImg').src = photos[index];
        }

        function closeLightbox() {
            document.getElementById('photoLightbox').classList.remove('active');
        }

        function changePhoto(direction) {
            currentPhotoIndex += direction;
            if (currentPhotoIndex < 0) currentPhotoIndex = photos.length - 1;
            if (currentPhotoIndex >= photos.length) currentPhotoIndex = 0;
            document.getElementById('lightboxImg').src = photos[currentPhotoIndex];
        }

        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (document.getElementById('photoLightbox').classList.contains('active')) {
                if (e.key === 'Escape') closeLightbox();
                if (e.key === 'ArrowLeft') changePhoto(-1);
                if (e.key === 'ArrowRight') changePhoto(1);
            }
        });
    </script>
</body>
</html>
