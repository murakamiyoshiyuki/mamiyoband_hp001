<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マミヨバンド初のワンマンライブ開催決定！ - マミヨバンド</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .live-detail {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 30px;
            color: var(--color-gold);
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .live-header {
            text-align: center;
            margin-bottom: 40px;
        }
        .live-header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-family: var(--font-heading-jp);
            color: #ffffff;
        }
        .live-venue {
            font-size: 1.2rem;
            color: var(--color-gold);
            margin-bottom: 20px;
            font-weight: bold;
        }
        .live-date {
            font-size: 1.5rem;
            color: #C30E2E;
            font-family: var(--font-en);
            margin-bottom: 10px;
        }
        .live-images {
            margin: 40px 0;
            text-align: center;
        }
        .live-images img {
            max-width: 100%;
            height: auto;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 2px solid #555;
            border-radius: 8px;
        }
        .coming-soon {
            text-align: center;
            font-size: 2rem;
            font-family: var(--font-en);
            color: var(--color-gold);
            margin: 60px 0;
            letter-spacing: 5px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); text-shadow: 0 0 20px var(--color-gold); }
            100% { opacity: 0.8; transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="live-detail">
        <a href="index.html#news" class="back-link">← TOPへ戻る</a>
        
        <div class="live-header">
            <p class="live-date">2026.07.05</p>
            <h1>マミヨバンド初のワンマンライブ開催決定！</h1>
            <p class="live-venue">@下北沢CLUB Que</p>
        </div>

        <div class="live-images">
            <!-- アップロードいただいたフライヤーはこちらに配置することを想定しています -->
            <img src="素材/LIVE/oneman_flyer.JPG" alt="マミヨバンド 初のワンマンライブフライヤー" onerror="this.src='素材/写真素材/IMG_5210.jpeg'; this.style.border='none'; console.log('フライヤー画像が見つからないためプレースホルダーを表示しました');">
        </div>

        <div class="coming-soon">
            DETAILS COMING SOON...
        </div>
    </div>
</body>
</html>
